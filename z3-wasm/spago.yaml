package:
  name: mycroft-z3-wasm
  description: >
    The WASM backend: the official z3-solver npm build (Z3 compiled to
    WebAssembly) behind the same Solver interface — mycroft without a native
    binary, in Node today and the browser tomorrow.
  publish:
    version: 0.1.0
    license: MIT
    location:
      githubOwner: afcondon
      githubRepo: purescript-mycroft
      subdir: z3-wasm
  dependencies:
    - aff: ">=8.0.0 <9.0.0"
    - aff-promise: ">=4.0.0 <5.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - mycroft: ">=0.1.0 <0.2.0"
    - prelude: ">=6.0.2 <7.0.0"
  test:
    main: Test.Z3Wasm.Main
    dependencies:
      - arrays
      - assert
      - console
      - ordered-collections
