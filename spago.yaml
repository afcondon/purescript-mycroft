package:
  name: mycroft
  description: >
    A thin SMT solver wrapper in the style of Haskell's simple-smt:
    s-expressions in, s-expressions out, a lockstep process session, and a small
    SMTLib veneer — named assertions, models, unsat cores.
  publish:
    version: 0.1.1
    license: MIT
    location:
      githubOwner: afcondon
      githubRepo: purescript-mycroft
  dependencies:
    - aff: ">=8.0.0 <9.0.0"
    - arrays: ">=7.3.0 <8.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - either: ">=6.1.0 <7.0.0"
    - exceptions: ">=6.1.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - lists: ">=7.0.0 <8.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - ordered-collections: ">=3.2.0 <4.0.0"
    - prelude: ">=6.0.2 <7.0.0"
    - refs: ">=6.0.0 <7.0.0"
    - strings: ">=6.0.1 <7.0.0"
    - transformers: ">=6.1.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
  test:
    main: Test.Mycroft.Main
    dependencies:
      - assert
      - console
      - quickcheck
workspace:
  packageSet:
    registry: 77.13.1
  extraPackages:
    baskerville-core:
      path: ../purescript-baskerville
    baskerville-sudoku:
      path: ../purescript-baskerville/examples/sudoku
