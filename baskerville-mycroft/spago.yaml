package:
  name: baskerville-mycroft
  description: >
    The SMT-backed oracle: Baskerville's ⊨ seam extended past enumerable world
    spaces. The claim universe stays finite; the solver replaces world
    enumeration; unsat cores answer "which observations force this claim".
  publish:
    version: 0.1.0
    license: MIT
    location:
      githubOwner: afcondon
      githubRepo: purescript-mycroft
      subdir: baskerville-mycroft
  dependencies:
    - aff: ">=8.0.0 <9.0.0"
    - arrays: ">=7.3.0 <8.0.0"
    - baskerville-core: ">=0.1.0 <0.2.0"
    - either: ">=6.1.0 <7.0.0"
    - exceptions: ">=6.1.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - mycroft: ">=0.1.0 <0.2.0"
    - ordered-collections: ">=3.2.0 <4.0.0"
    - prelude: ">=6.0.2 <7.0.0"
    - transformers: ">=6.1.0 <7.0.0"
  test:
    main: Test.Bridge.Main
    dependencies:
      - assert
      - baskerville-sudoku
      - console
      - effect
      - strings
